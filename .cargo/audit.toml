# Project-level cargo-audit configuration
# See: https://github.com/RustSec/rustsec/blob/main/cargo-audit/audit.toml.example

[advisories]
ignore = [
    # async-std is discontinued (unmaintained).
    # Transitive via minio 0.4.0 (optional dependency behind the minio
    # feature), which requires it unconditionally; no patched version
    # exists upstream. s3s-proxy runs on tokio and never calls into
    # async-std. Revisit: remove this ignore once minio drops the
    # async-std dependency.
    "RUSTSEC-2025-0052",
]
