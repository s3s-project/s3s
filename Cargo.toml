[workspace]
members = ["crates/*", "codegen"]
resolver = "3"

[workspace.package]
edition = "2024"
repository = "https://github.com/Nugine/s3s"
license = "Apache-2.0"
rust-version = "1.96.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
# deny
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
self_named_module_files = "deny"
# warn
dbg_macro = "warn"
# allow
module_name_repetitions = "allow"
multiple_crate_versions = "allow"

[profile.release]
debug = "line-tables-only"

[workspace.dependencies]
# Data structures
arc-swap = "1.9.2"
arrayvec = "0.7.8"
bytes = "1.12.1"
bytestring = "1.5.1"
indexmap = "2.14.0"
once_cell = "1.21.4"
smallvec = "1.15.2"
uuid = "1.24.0"

# Text encoding
atoi = { version = "3.1.0", default-features = false }
base64-simd = "0.8.0"
hex-simd = "0.8.0"
itoa = "1.0.18"
nom = "8.0.0"

# Date & time
chrono = { version = "0.4.45", default-features = false }
time = "0.3.53"

# Utilities
cfg-if = "1.0.4"
const-str = "1.1.0"
memchr = "2.8.3"
numeric_cast = "0.3.0"
path-absolutize = "4.0.1"
std-next = "0.1.9"

# Crypto
crc-fast = "1.10.0"
crc32c = "0.6.8"
hmac = "0.13.0"
md-5 = "0.11.0"
openssl = "0.10.81"
sha1 = "0.11.0"
sha2 = "0.11.0"
subtle = "2.6.1"
zeroize = "1.9.0"

# Error handling
anyhow = "1.0.103"
thiserror = "2.0.18"

# Serialization
quick-xml = { version = "0.41.0", features = ["serialize"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
serde_urlencoded = "0.7.1"

# Async & concurrency
async-trait = "0.1.89"
futures = { version = "0.3.32", default-features = false }
futures-util = "0.3.32"
pin-project-lite = "0.2.17"
sync_wrapper = { version = "1.0.2", default-features = false }
tokio = "1.52.3"
tokio-util = "0.7.18"
transform-stream = "0.3.1"

# HTTP
axum = "0.8.9"
http = "1.4.2"
http-body = "1.1.0"
http-body-util = "0.1.4"
httparse = "1.10.1"
hyper = "1.10.1"
hyper-util = "0.1.20"
mime = "0.3.17"
tokio-rustls = "0.26.4"
tower = { version = "0.5.3", default-features = false }
url = "2.5.8"
urlencoding = "2.1.3"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "form", "query"] }

# Logging & observability
tracing = "0.1.44"
tracing-error = "0.2.1"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "time"] }

# CLI
clap = { version = "4.6.2", features = ["derive"] }

# Storage backends
opendal = { version = "0.58.0", default-features = false }

# AWS SDK
aws-config = { version = "1.9.0", default-features = false }
aws-credential-types = "1.3.0"
aws-sdk-s3 = { version = "1.138.0", default-features = false, features = ["default-https-client", "http-1x", "rt-tokio", "sigv4a"] }
aws-sdk-sts = { version = "1.108.0", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-smithy-runtime-api = "1.13.0"
aws-smithy-types = "1.6.1"
aws-smithy-types-convert = "0.61.1"
