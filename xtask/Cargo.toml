[package]
name = "xtask"
version = "0.0.0"
edition.workspace = true
repository.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
clap.workspace = true
quick-xml.workspace = true
regex.workspace = true
# `system-proxy` is part of the workspace default set, which is disabled
# workspace-wide: without it the crawler ignores HTTPS_PROXY and stalls.
reqwest = { workspace = true, features = ["blocking", "system-proxy"] }
serde.workspace = true
serde_json = { workspace = true, features = ["preserve_order"] }
time.workspace = true
