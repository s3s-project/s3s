[package]
name = "s3s-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
bytes = "1"
futures = "0.3"
libfuzzer-sys = "0.4"
s3s = { path = "../crates/s3s" }

[features]
minio = ["s3s/minio"]

[[bin]]
name = "xml_bodies"
path = "fuzz_targets/xml_bodies.rs"
test = false
bench = false
doc = false

[[bin]]
name = "aws_chunked"
path = "fuzz_targets/aws_chunked.rs"
test = false
bench = false
doc = false

[[bin]]
name = "syntax_parsers"
path = "fuzz_targets/syntax_parsers.rs"
test = false
bench = false
doc = false

[[bin]]
name = "gen_corpus"
path = "bin/gen_corpus.rs"
test = false
bench = false
doc = false

# Standalone workspace: intentionally outside the main s3s workspace.
# Requires nightly (libFuzzer + sanitizer instrumentation); the main
# workspace MSRV does not apply here.
[workspace]
